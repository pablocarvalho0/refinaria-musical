# Identidade visual do canal — valores que os scripts leem.
#
# Este arquivo é a fonte da verdade do visual, do mesmo jeito que a transcrição
# é a fonte da verdade do conteúdo. Nenhum número de aparência deve estar
# escrito dentro de um script: se está aqui, muda em um lugar só e vale para os
# 47 episódios.
#
# Quem consome: scripts/legenda.py (--formato).
# O porquê de cada escolha: docs/04-identidade.md.


[fonte]
familia = "Inter"
# Bold é o -1 no campo Bold do estilo .ass, aplicado pelo legenda.py.

# Métrica medida em 30/08/2026 renderizando com o próprio libass, em seis
# tamanhos (40 a 72), sobre a linha mais longa do ep00 ("é um teste, então
# posso fazer mais vídeos", 41 caracteres). A relação é exatamente linear:
#
#     largura da linha em px = n_caracteres * largura_por_char * tamanho
#     altura da caixa em px  = tamanho * altura_por_tamanho
#
# Serve para dimensionar um formato novo por cálculo, em vez de tentativa e
# erro. Se a família da fonte mudar, remedir — estes números são dela.
largura_por_char = 0.4119
altura_por_tamanho = 0.8148


# ---------------------------------------------------------------------------
# Paleta — extraída do material escrito do próprio Pablo
#
# Origem: ~/Documents/proj-harmonia/guia-harmonia-funcional.pdf e
# plano-playlist-harmonia.pdf, escritos em 21/08/2026. As cores abaixo foram
# medidas nos PDFs renderizados, isolando os pixels saturados.
#
# A primeira proposta desta identidade era turquesa, com o argumento de que o
# acento precisava contrastar com o material filmado, que é 96% quente (67%
# vermelho, 15% laranja, 14% magenta em 633.600 pixels amostrados). O argumento
# estava tecnicamente certo e resolvia o problema errado: a medição de contraste
# feita depois estabeleceu que **o acento nunca vai sobre a foto** — ele vive em
# chip, barra e fundo sólido, porque sobre imagem só o branco tem contraste
# garantido. A competição com o material, que justificava o frio, não acontece.
#
# E havia uma razão mais forte do outro lado: já existe material escrito com
# direção estabelecida, e harmonia funcional é assunto de livro e de tradição.
# Uma identidade que conversa com esse material vale mais que uma que contrasta
# com os frames. Somado a isso, o autor não se reconheceu no turquesa — e
# identidade que o autor não veste não funciona, por melhor que seja a defesa.
#
# O sistema é de par claro/escuro, e já era coerente no material original:
#   sobre fundo ESCURO  -> texto creme,  acento SALMÃO   (8,7:1)
#   sobre fundo CLARO   -> texto tinta,  acento TERRACOTA (5,0:1)
#   chip                -> fundo terracota, texto creme  (4,8:1)
#
# O terracota tem luminância 0,146: é escuro, então funciona como texto sobre
# claro e como fundo de chip, mas NÃO como texto sobre fundo escuro (3,4:1).
# O salmão é o oposto. Usar um no lugar do outro quebra o contraste.
# ---------------------------------------------------------------------------

[paleta]
fundo = "#181510"        # quase preto quente, medido da capa do guia
fundo_suave = "#221D17"  # cartões e faixas sobre o fundo
papel = "#F8F6F2"        # fundo claro, para peças impressas e documentos
creme = "#F0E8E0"        # caixas de destaque, medido do guia
texto = "#F5F1EA"        # sobre fundo escuro
texto_tinta = "#181510"  # sobre fundo claro
texto_fraco = "#A79C8E"  # secundário sobre escuro; só em fundo sólido
acento = "#AE4E2A"       # terracota: texto sobre claro, e fundo de chip
acento_claro = "#DEA87E" # salmão: acento sobre fundo escuro

[tipografia]
# Duas faces com papéis separados, e a separação é funcional.
#
# A Charter carrega a marca e os títulos: é serifada, robusta e editorial, do
# mesmo mundo do guia escrito. (O PDF do guia saiu em DejaVu Serif, mas isso é
# fallback do gerador, não escolha — a Charter é a fonte que aquele material
# queria ser.) O Pillow carrega Type1, então ela funciona nas peças raster.
#
# A Inter fica na legenda queimada e em qualquer texto pequeno sobre imagem em
# movimento, onde a serifa perde e a legibilidade manda. A legenda já está
# validada em Inter (docs/04) e não muda por causa da marca.
marca = "Charter"
marca_arquivo = "/usr/share/fonts/X11/Type1/c0632bt_.pfb"
marca_regular = "/usr/share/fonts/X11/Type1/c0648bt_.pfb"
marca_italico = "/usr/share/fonts/X11/Type1/c0649bt_.pfb"
legenda = "Inter"

[marca]
nome = "Pablo Carvalho"
sufixo = "SM"
handle = "@PabloCarvalho-q1o"
tema = "harmonia funcional"

[cor]
# Formato .ass: &HAABBGGRR (alfa invertido — 00 é opaco).
texto = "&H00FFFFFF"      # branco puro
contorno = "&H00101010"   # quase preto; não é preto puro para não "chapar"
secundaria = "&H000000FF"  # karaokê, não usado
fundo = "&H96000000"      # preto a 59%; só vale com BorderStyle=3, hoje 1


# ---------------------------------------------------------------------------
# Formatos
#
# `margem_inferior` é a distância da base do texto até a borda de baixo, em
# unidades de PlayRes. `margem_lateral` vale para os dois lados.
#
# A montagem dos cues NÃO muda entre formatos: mesmo texto, mesmos tempos.
# Só a apresentação muda. Isso é o que permite cortar um vertical de dentro do
# longo sem redecidir nada.
#
# `chars_por_linha` e `linhas_max` são o ONDE a linha quebra, que é
# apresentação e depende da largura — não confundir com o teto de 84
# caracteres por cue do legenda.py, que é norma de leitura e define os tempos.
# O `.ass` usa WrapStyle 2, que desliga a quebra automática do libass: a linha
# que sai do Python é a que vai para a tela, inteira. Aplicar os 42 do 16:9 ao
# vertical jogava 10 das 16 linhas do ep00 para fora da tela.
# ---------------------------------------------------------------------------

[formato.16x9]
descricao = "YouTube longo. O .srt sobe separado; o .ass é para queimar quando precisar."
largura = 1920
altura = 1080
tamanho = 54
contorno = 3.2
sombra = 1.0
margem_lateral = 140
margem_inferior = 90
chars_por_linha = 42
linhas_max = 2
# Validado na tela sobre fundo claro e escuro em 30/08/2026 (ver CLAUDE.md,
# "Legendas"). A área útil de 1640px comporta 73 caracteres na fonte 54, e a
# linha mais longa do ep00 usa 56% dela: aqui o limite de 42 caracteres é
# norma de leitura, não falta de espaço.

[formato.9x16]
descricao = "Shorts e Reels. A legenda é queimada — o corte vertical já reencoda."
largura = 1080
altura = 1920
tamanho = 78
contorno = 4.6
sombra = 1.4
margem_lateral = 60
margem_inferior = 480
chars_por_linha = 29
linhas_max = 3
chars_por_cue = 40
dur_minima = 0.70
# O ritmo do cue é do formato, não da norma única — decidido em 05/09/2026,
# depois de ver as quatro variantes na tela.
#
# O 16x9 não declara estes dois e fica com a norma de leitura do legenda.py
# (84 caracteres, 1,20s). Aqui o cue tem ~3 palavras e troca a cada 1,5s.
# O motivo é de mídia, não de gosto: o Reel é assistido sem som e em rolagem,
# a legenda É o áudio, e a troca frequente segura o olho. No YouTube longo o
# .srt é opcional e quem ligou quer ler — lá duas linhas ganham.
#
# char/s NÃO é o critério aqui, e a medição diz por quê: encurtar o cue PIORA
# a métrica (24,5 -> 32,9 no improviso_3), porque a duração encolhe junto com
# o texto. Os 17 char/s da norma pressupõem duas linhas lidas em sacadas; num
# cue de três palavras o olho pega tudo num golpe. O critério que vale é o
# piso de duração — que o cue não pisque —, e é o dur_minima que o guarda.
#
# 0,70s e não 0,60: a variante de 20 caracteres chegava a 0,56s de cue.
#
# 40 e não 28, ajustado em 05/09/2026 depois de ver na tela. 28 sincronizava
# bem com a fala mas partia a frase: o olho lia "vou fazer uma inveja" e só
# achava o resto no cue seguinte. Com 40 são 8 cues de 2,33s, e 7 deles
# fecham em sentido completo. Acima disso o ganho some — 46 volta a cortar
# no meio ("tomara que dê / certo") e o cue começa a estacionar de novo.
# Dimensionado por cálculo com a métrica acima, não por proporção do 16:9.
#
# O critério é caracteres por linha, não porcentagem da tela: linha curta lê
# melhor em tela pequena e em movimento. Com margem lateral 60 sobram 960px, e
# a fonte 78 dá 29,9 caracteres por linha. Um cue no teto de 84 caracteres
# quebra em três linhas de ~28, que ocupam 229px.
#
# Contorno e sombra mantêm a proporção do 16:9 (5,93% e 1,85% do tamanho), que
# é o que já foi aprovado na tela.
#
# margem_inferior = 480 é 25% da altura: a faixa que a UI de Reels e Shorts
# cobre com botões, legenda do post e barra de progresso. Com três linhas, o
# topo do bloco fica a 37% da altura, ainda longe do rosto no terço superior.
#
# DECIDIDO EM 30/08/2026: adotar os 25% do browser-use/video-use sem medir.
#
# É o único número deste arquivo que não veio de medição própria — vem da
# documentação deles (que usa 31%). A decisão foi consciente: o padrão importado
# é razoável, o custo de errar é uma linha aqui, e não vale segurar publicação
# por isso. Se em algum episódio a legenda aparecer coberta pela interface do
# Reels ou do Shorts, o caminho já está pronto: rode
# ./scripts/gabarito-safe-area.sh, publique o vídeo-régua como rascunho, veja no
# print até onde a interface cobre e corrija este número.
#
# Ou seja: não é uma lacuna esquecida, é um valor emprestado com a fonte
# declarada e o teste engatilhado.


# ---------------------------------------------------------------------------
# Cartelas de vídeo — abertura e créditos
#
# Consumidor: scripts/cartelas.py, que desenha PNG com alfa e entrega ao
# overlay do ffmpeg. Não usa drawtext: a Charter é Type1, o drawtext lida mal
# com ela, e o parser do filtergraph ainda come '%' solto sem avisar.
#
# Geometria: a cartela NÃO tem margens próprias. Ela reusa
# `formato.<fmt>.margem_lateral` e `formato.<fmt>.margem_inferior`, que são a
# safe area já decidida para o formato. Duplicar esses números aqui criaria
# duas verdades sobre onde a interface do Reels/Shorts cobre a tela — e a que
# ficasse desatualizada falharia em silêncio, que é o modo de falha que este
# projeto mais persegue.
#
# Cor: sobre imagem, TODO texto é creme. O acento vive só na barra, no chip e
# no fio — elemento gráfico, nunca letra solta sobre a foto. É a regra medida
# em docs/04-identidade.md, e a cartela não abre exceção.
# ---------------------------------------------------------------------------

[cartela]
barra_largura = 12       # a mesma barra do lockup, do monograma e da thumbnail
barra_gap = 32           # respiro entre a barra e o texto, igual à thumbnail
contorno = 2             # docs/04: 2px foi o que devolveu massa ao traço fino
                         # da Charter sobre foto. Halo sozinho não resolveu.
entrelinha = 1.14        # múltiplo do tamanho da fonte

# O scrim é o que carrega o contraste, não a cor da letra.
#
# Medido neste episódio (1080x1920, externa com céu, 05/09/2026), o vídeo cru
# não tem UMA faixa horizontal onde branco puro alcance 4,5:1: a mediana das
# bandas vai de L=0,046 a L=0,571, e o p95 — o pixel claro que decide — fica
# entre 0,33 e 0,84, o que dá de 1,2:1 a 2,7:1 em todo lugar. Não existe
# "colocar em cima do escuro"; existe escurecer.
#
# `forca` é o alfa do plano cheio, sobre paleta.fundo. `rampa` é a altura em
# px do degradê acima do bloco, para não haver borda dura. Abaixo do bloco o
# scrim segue cheio até a base do quadro: aquela faixa é justamente a que a
# interface da plataforma cobre.
scrim_forca = 0.72
scrim_rampa = 260
scrim_folga = 44         # px de plano cheio acima da primeira linha

# Tempos de aparecimento. Duração em segundos.
fade_entrada = 0.80
fade_saida = 0.80
fade_video_saida = 1.50  # o fade-out de imagem no fim do vídeo

[cartela.abertura]
duracao = 6.40           # tempo total em tela, contando os dois fades
atraso = 0.60            # quando começa a entrar
tamanho_titulo = 72
tamanho_credito = 34
tamanho_chip = 26
chip_tracking = 3        # px extra entre caracteres da caixa alta

[cartela.creditos]
duracao = 8.20           # entra faltando este tanto para o fim
tamanho_titulo = 58
tamanho_credito = 34
tamanho_etiqueta = 24
tamanho_nome = 66
tamanho_handle = 28
etiqueta_tracking = 3
fio_largura = 2          # o fio fino que separa a obra de quem a executou


# ---------------------------------------------------------------------------
# Vertical por empilhamento — scripts/vertical.sh
#
# Consumidor: scripts/vertical.sh, que transforma um master horizontal de duas
# pessoas em 9:16 recortando duas metades e as empilhando. Medido em
# 05/09/2026: nenhum corte 9:16 cabe as duas, e a banda com fundo borrado
# deixa a imagem útil em 32% da altura. Ver "Vertical a partir de master
# horizontal" no CLAUDE.md.
# ---------------------------------------------------------------------------

[empilhado]
# O plano geral abre o vídeo e depois o quadro se divide. Meio segundo de
# fundido é o que separa "a câmera mudou" de "corte seco": abaixo disso lê
# como corte, acima começa a arrastar. Vale para o improviso_4; se um
# episódio pedir outro tempo, muda aqui.
transicao = 0.50

# Quanto dura o afastamento do plano fechado para o plano geral. 1,2s é o
# que separa "a câmera se afastou" de "cortaram": abaixo de ~0,8s o olho lê
# como corte, acima de ~1,6s o movimento começa a chamar mais atenção que a
# música. A curva é smoothstep — ver scripts/zoom-cmds.py.
zoom = 1.20
